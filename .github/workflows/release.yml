name: Release Extension

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set to 'true' in repository settings to enable Firefox signing
      # Repository Settings → Secrets and variables → Actions → Variables tab → New repository variable
      # Name: ENABLE_FIREFOX_SIGNING, Value: true
      # Requires FIREFOX_API_KEY and FIREFOX_API_SECRET to be configured in Secrets tab
      ENABLE_FIREFOX_SIGNING: ${{ vars.ENABLE_FIREFOX_SIGNING || 'false' }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so the build can derive the version from the
          # git tag (esbuild.config.js getGitVersion), not just the jq fallback.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Fail fast on a tag the build can't version correctly. The workflow
      # triggers on any `v*`, but the build resolves the version via a 3-part
      # `git describe --match` glob — so a short tag like `v1.2` or a prerelease
      # like `v1.2.3-beta.1` would silently resolve to the PREVIOUS release's
      # version. Require exactly X.Y.Z: it's the only shape that resolves end to
      # end (App Store MARKETING_VERSION allows at most 3 parts) and what every
      # doc example uses. (EXTENSION_VERSION_RE stays looser — a manifest can
      # hold a 4th part — but a release *tag* must be 3 parts.)
      - name: Validate release tag is a plain version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag 'v$VERSION' is not a plain version. Use vX.Y.Z (exactly three numeric parts, no prerelease suffix)."
            exit 1
          fi
          echo "✅ Release version: $VERSION"

      # Fallback only: with fetch-depth 0 the build reads the tag directly, but
      # keep the manifests patched in case describe ever fails. All four
      # manifests are covered so none can fall back to the 0.0.0 placeholder.
      - name: Update version in manifests
        run: |
          for m in manifest.json manifest.firefox.json manifest.firefox-direct.json manifest.safari.json; do
            jq ".version = \"$VERSION\"" "src/$m" > temp.json && mv temp.json "src/$m"
          done

      # package.sh cleans dist/, builds Chrome + Firefox AMO, zips them, and
      # runs the version guard (--web).
      - name: Package extensions
        run: bash scripts/package.sh

      # Built after packaging: package.sh wipes dist/, so this must run later to
      # leave dist/firefox-direct in place for the signing step below.
      - name: Build Firefox self-hosted version (with update_url)
        if: env.ENABLE_FIREFOX_SIGNING == 'true'
        run: |
          echo "🔨 Building Firefox self-hosted version (different add-on ID, version ${VERSION})..."
          npm run build:firefox-self-hosted

      - name: Validate packaged files exist
        run: |
          if [ ! -f "dist-zip/lee-su-threads-chrome-v${VERSION}.zip" ]; then
            echo "Error: Chrome package not found"
            exit 1
          fi
          if [ ! -f "dist-zip/lee-su-threads-firefox-v${VERSION}-amo.zip" ]; then
            echo "Error: Firefox AMO package not found"
            exit 1
          fi
          echo "✅ All required packages created successfully"

      - name: Sign Firefox extension (self-distributed)
        if: env.ENABLE_FIREFOX_SIGNING == 'true'
        timeout-minutes: 8
        run: |
          # Clean up any existing XPI files to avoid selecting wrong file
          rm -f dist-zip/*.xpi
          npx web-ext sign \
            --source-dir=dist/firefox-direct \
            --artifacts-dir=dist-zip \
            --api-key=${{ secrets.FIREFOX_API_KEY }} \
            --api-secret=${{ secrets.FIREFOX_API_SECRET }} \
            --channel=unlisted \
            --no-input

      - name: Rename signed Firefox extension
        if: env.ENABLE_FIREFOX_SIGNING == 'true'
        run: |
          # Find the signed XPI (web-ext creates a hash-based filename)
          XPI_FILE=$(find dist-zip -name "*.xpi" -type f | head -1)
          if [ -n "$XPI_FILE" ]; then
            mv "$XPI_FILE" dist-zip/lee-su-threads-firefox-v${VERSION}-direct-install.xpi
            echo "✅ Renamed: $(basename "$XPI_FILE") → lee-su-threads-firefox-v${VERSION}-direct-install.xpi"
          else
            echo "❌ Error: No .xpi file found"
            ls -la dist-zip/
            exit 1
          fi

      - name: Validate signed extension exists
        if: env.ENABLE_FIREFOX_SIGNING == 'true'
        run: |
          if [ ! -f "dist-zip/lee-su-threads-firefox-v${VERSION}-direct-install.xpi" ]; then
            echo "Error: Signed extension not found"
            exit 1
          fi

      - name: Generate update manifest
        if: env.ENABLE_FIREFOX_SIGNING == 'true'
        run: |
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" updates.json.template > dist-zip/updates.json

      - name: Create GitHub Release (with signed Firefox)
        if: env.ENABLE_FIREFOX_SIGNING == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-zip/lee-su-threads-chrome-v*.zip
            dist-zip/lee-su-threads-firefox-v*-amo.zip
            dist-zip/lee-su-threads-firefox-v*-direct-install.xpi
            dist-zip/updates.json
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (without signing)
        if: env.ENABLE_FIREFOX_SIGNING != 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-zip/lee-su-threads-chrome-v*.zip
            dist-zip/lee-su-threads-firefox-v*-amo.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

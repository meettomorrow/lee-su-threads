name: _perm-probe (TEMPORARY)

# TEMPORARY: verifies whether a GITHUB_TOKEN scoped like the gate job can read
# the collaborator-permission endpoint. Delete this file before merge.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  probe-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: contents:read + pull-requests:read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "=== scopes: contents:read + pull-requests:read ==="
          set +e
          gh api "repos/$REPO/collaborators/$ACTOR/permission" -i 2>&1 | sed -n '1p;/^[Ss]tatus:/p'
          echo "--- body ---"
          gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>&1
          echo "exit=$?"

  probe-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: contents:write + pull-requests:read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "=== scopes: contents:write + pull-requests:read ==="
          set +e
          gh api "repos/$REPO/collaborators/$ACTOR/permission" -i 2>&1 | sed -n '1p;/^[Ss]tatus:/p'
          echo "--- body ---"
          gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>&1
          echo "exit=$?"

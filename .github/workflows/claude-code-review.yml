name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  # Path 1: same-repo PRs get an automatic review on every open/update. Only
  # people with write access can push a branch to this repo, so a same-repo head
  # means the author will pass the claude-code-action write check. External
  # contributors open PRs from forks and are skipped here (they use Path 2).
  # NOTE: we key on fork status rather than author_association because private
  # org membership makes author_association come through as NONE/CONTRIBUTOR in
  # the webhook payload, which would wrongly skip members' own PRs.
  auto-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

  # Path 2: external contributor PRs are reviewed on demand. A maintainer
  # comments "/claude-review" on the PR to trigger it. The actor is the
  # commenter, so the action's own write-permission check is what gates access:
  # a maintainer passes and the review runs; an external contributor fails the
  # check and the job stops without reviewing. We deliberately do NOT gate on
  # comment.author_association here — private org membership would report the
  # maintainer as NONE and wrongly skip the job.
  manual-review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # For issue_comment events the default checkout is the base branch, so we
      # explicitly check out the PR head (works for fork PRs via refs/pull/N/head).
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

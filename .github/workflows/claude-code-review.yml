name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# One in-flight review per PR *per path*. Rapid pushes coalesce and repeated
# /claude-review comments coalesce — but the event name is part of the key so a
# pull_request (synchronize) run can't cancel a maintainer's in-flight
# issue_comment manual review for the same PR (a shared key would cancel it and
# then skip every job, silently losing the requested review).
concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Path 1: same-repo PRs get an automatic review on every open/update. Only
  # people with write access can push a branch to this repo, so a same-repo head
  # means the author will pass the claude-code-action write check. External
  # contributors open PRs from forks and are skipped here (they use Path 2).
  #
  # We key on fork status rather than author_association for two reasons:
  #   1. Private org membership surfaces as NONE/CONTRIBUTOR in webhook payloads,
  #      which would wrongly skip members' own PRs.
  #   2. GitHub never passes repository secrets (ANTHROPIC_API_KEY) to
  #      pull_request runs from a fork, so auto-review could not work on a fork
  #      PR regardless of who authored it — even a maintainer's own fork PR.
  #      Those must use the /claude-review comment path (Path 2).
  auto-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

  # Gate for Path 2: resolve whether the commenter actually has write/admin
  # access before spinning up the review. Reading the live collaborator
  # permission avoids author_association (unreliable under private membership)
  # and turns an unauthorized /claude-review into a clean skip on manual-review
  # rather than a red failure inside claude-code-action. Fails closed: any lookup
  # error denies access.
  gate:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      allowed: ${{ steps.check.outputs.allowed }}

    steps:
      - name: Check commenter permission
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # Legacy .permission returns only admin|write|read|none (maintain maps
          # to write, triage to read), so admin|write is the full "can trigger"
          # set — no dead arms, and custom roles collapse to their base role.
          if ! perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/tmp/perr); then
            # A lookup failure (e.g. the token can't read this endpoint) is an
            # infrastructure bug, not an authorization decision. Fail closed AND
            # loud — write the deny output, then exit non-zero so the gate job
            # goes red instead of masquerading as a routine "not a maintainer"
            # grey skip. (tr collapses gh's multi-line stderr; a workflow command
            # only consumes its first line.)
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::permission lookup failed for '$ACTOR' (denying): $(tr '\n' ' ' </tmp/perr)"
            exit 1
          fi
          echo "actor '$ACTOR' has '$perm' permission"
          case "$perm" in
            admin|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::'$ACTOR' lacks write access ('$perm') — skipping review"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Path 2: external contributor PRs are reviewed on demand when a maintainer
  # comments "/claude-review". Runs only if the gate confirmed write access, so
  # the actor always passes claude-code-action's own check too.
  #
  # SECURITY: this job runs on an issue_comment event, which — unlike a fork
  # pull_request run — has full access to repository secrets (ANTHROPIC_API_KEY)
  # and a write-scoped token, and it checks out UNTRUSTED fork code. Never add a
  # step that executes that code (npm ci / install / build / test): a postinstall
  # hook or a patched test in the fork would be RCE with a live write token.
  manual-review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # issue_comment checks out the base branch by default, so fetch the PR head
      # explicitly (works for fork PRs via refs/pull/N/head). persist-credentials:
      # false keeps the token out of .git/config — this job never pushes and must
      # not leave a credential on disk alongside untrusted fork code.
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Always pass the PR number explicitly (e.g. `gh pr diff <PR NUMBER>`):
            this job checks out a detached HEAD, so bare `gh pr diff`/`gh pr view`
            cannot infer the PR from the current branch.

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
